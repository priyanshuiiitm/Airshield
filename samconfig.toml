version = 0.1

[default]
[default.global.parameters]
stack_name = "airshield-api-dev"

[default.build.parameters]
cached = false
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "airshield-api-dev"
region = "ap-south-1"
parameter_overrides = "Environment=\"dev\" AllowedOrigin=\"http://localhost:5173\" DefaultBufferMinutes=5.0 SnapshotId=\"demo_v1\" DefaultMode=\"snapshot\""
image_repositories = []
